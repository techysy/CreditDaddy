<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 本地 file 页面：不加载任何外部资源，脚本全部内联 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>CreditDaddy</title>
<style>
/* 设计 token 直抄面板（src/panel.html 的 :root / dark），与面板是同一套视觉语言。
   ⚠️ 不要抄 10Router 的橙红（#E56A4A / #E8541C）——那是 10R 的品牌色。
   CreditDaddy 的主按钮是**黑底白字**（--btn-bg #1f1f1f），品牌黄橙（--logo）
   只用于图标底色，二者不要混用。 */
:root {
  color-scheme: light;
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #fafafa; --tertiary: #f0f0f0;
  --border-subtle: #eeeeee; --border: #e5e5e5;
  --text: #1f1f1f; --text-2: #5f6368; --text-3: #999999;
  --btn-bg: #1f1f1f; --btn-fg: #ffffff;
  --logo: #FF8A14; --logo-soft: rgba(255, 138, 20, .14); --logo-ink: #B35C00;
  --ok: #16a34a; --err: #dc2626;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 36px -8px rgba(15,23,42,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0a0a0c; --surface: #131316; --surface-2: #17171b; --tertiary: #1b1b20;
    --border-subtle: #202025; --border: rgba(255,255,255,.13);
    --text: #e6e6e9; --text-2: rgba(230,230,233,.72); --text-3: rgba(230,230,233,.5);
    --btn-bg: rgba(255,255,255,.92); --btn-fg: #0a0a0c;
    --logo: #FF8A14; --logo-soft: rgba(255, 138, 20, .16); --logo-ink: #FFB65C;
    --ok: #2ee59d; --err: #ff6b6b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 48px -8px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
/* 固定尺寸无边框窗：内容高度由 fit() 精确回报，亚像素溢出不该出滚动条 */
html, body { margin: 0; padding: 0; overflow: hidden; }
body {
  font: 13px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  user-select: none; -webkit-user-select: none;
}
svg.ic { fill: currentColor; display: block; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  height: 38px; padding: 0 6px 0 14px;
  -webkit-app-region: drag;
}
.titlebar .brand { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
#closeBtn {
  -webkit-app-region: no-drag;
  width: 30px; height: 30px; border: 0; border-radius: 10px;
  background: transparent; color: var(--text-3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s ease-out, color .15s ease-out;
}
#closeBtn:hover { background: var(--tertiary); color: var(--text); }
#closeBtn svg { width: 18px; height: 18px; }
.card {
  margin: 4px 12px 12px;
  padding: 18px 18px 16px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}
.iconRow { display: flex; align-items: center; gap: 12px; }
.tile {
  width: 40px; height: 40px; flex: none; border-radius: 10px;
  display: none; align-items: center; justify-content: center;
}
.tile svg { width: 22px; height: 22px; }
.tile.brand { background: var(--logo-soft); color: var(--logo-ink); }
.tile.ok { background: rgba(22, 163, 74, .14); color: var(--ok); }
.tile.err { background: rgba(220, 38, 38, .12); color: var(--err); }
.spinWrap { width: 40px; height: 40px; flex: none; display: none; align-items: center; justify-content: center; color: var(--logo); }
.spinWrap svg { width: 24px; height: 24px; animation: dashSpin .9s linear infinite; }
@keyframes dashSpin { to { transform: rotate(360deg); } }
#title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--text); }
#version {
  display: none; align-self: flex-start;
  padding: 2px 10px; border-radius: 999px;
  background: var(--logo-soft); color: var(--logo-ink);
  font-size: 12px; font-weight: 600;
}

#body { margin: 0; font-size: 13px; color: var(--text-2); white-space: pre-line; }
#fileName {
  display: none; font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#progress { display: none; flex-direction: column; gap: 6px; }
.bar { height: 8px; border-radius: 999px; background: var(--tertiary); overflow: hidden; }
#barFill {
  height: 100%; width: 0; border-radius: 999px;
  background: var(--btn-bg);
  transition: width .18s ease-out;
}
#barFill.indet { width: 40% !important; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
#progressText { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
#buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 4px; }
#buttons:empty { display: none; }
#buttons button {
  height: 36px; padding: 0 16px; font-size: 14px; font-weight: 600; border-radius: 10px;
  display: inline-flex; align-items: center; gap: 8px;
  border: 0; background: transparent; color: var(--text-2); cursor: pointer;
  transition: all .15s ease-out; font-family: inherit;
}
#buttons button:hover { background: var(--tertiary); color: var(--text); }
#buttons button:active { transform: scale(.97); }
#buttons button.primary { background: var(--btn-bg); color: var(--btn-fg); }
#buttons button.primary:hover { opacity: .88; color: var(--btn-fg); }
#buttons button svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<!-- 图标内联 sprite，无字体无外链 -->

</svg>
<div class="titlebar">
  <span class="brand" id="brand">CreditDaddy</span>
  <button id="closeBtn" aria-label="close"><svg class="ic"><use href="#i-close"/></svg></button>
</div>
<div class="card">
  <div class="iconRow">
    <div class="spinWrap" id="spinWrap"><svg class="ic spin"><use href="#i-progress"/></svg></div>
    <div class="tile" id="tile"><svg class="ic"><use id="stateUse" href="#i-download"/></svg></div>
    <h1 id="title"></h1>
  </div>
  <span id="version"></span>
  <p id="body"></p>
  <div id="progress">
    <div id="fileName"></div>
    <div class="bar"><div id="barFill"></div></div>
    <div id="progressText"></div>
  </div>
  <div id="buttons"></div>
</div>
<script>
(function () {
  'use strict';
  var api = window.updateApi;
  var $ = function (id) { return document.getElementById(id); };
  var strings = {};

  // 状态 → 图标/色调（checking 走 spinner，不进此表）
  var STATE_ICON = {
    available: { icon: 'i-download', tone: 'brand' },
    downloading: { icon: 'i-download', tone: 'brand' },
    downloaded: { icon: 'i-check-circle', tone: 'ok' },
    latest: { icon: 'i-check-circle', tone: 'ok' },
    unsupported: { icon: 'i-error', tone: 'err' },
    error: { icon: 'i-error', tone: 'err' },
  };
  var SVGNS = 'http://www.w3.org/2000/svg';

  function fit() {
    requestAnimationFrame(function () {
      api.fitHeight(Math.ceil(document.body.getBoundingClientRect().height));
    });
  }
  function addBtn(label, action, opts) {
    opts = opts || {};
    var b = document.createElement('button');
    if (opts.primary) b.className = 'primary';
    if (opts.icon) {
      var svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('class', 'ic');
      var use = document.createElementNS(SVGNS, 'use');
      use.setAttribute('href', '#' + opts.icon);
      svg.appendChild(use);
      b.appendChild(svg);
    }
    b.appendChild(document.createTextNode(label));
    b.addEventListener('click', function () { api.action(action); });
    $('buttons').appendChild(b);
  }

  function render(view) {
    if (!view || !view.phase) return;
    var st = view.phase;
    var meta = STATE_ICON[st] || null;
    $('spinWrap').style.display = st === 'checking' ? 'flex' : 'none';
    var tile = $('tile');
    if (meta) {
      $('stateUse').setAttribute('href', '#' + meta.icon);
      tile.setAttribute('class', 'tile ' + meta.tone);
      tile.style.display = 'flex';
    } else {
      tile.style.display = 'none';
    }

    // 标题 / 正文由主进程按状态算好下发（文案单源在 main.js，页面只做展示）
    var TITLES = {
      checking: strings.checkingTitle,
      latest: strings.latestTitle,
      available: view.rebuild ? strings.rebuildTitle : strings.availableTitle,
      downloading: strings.downloadingTitle,
      downloaded: strings.downloadedTitle,
      unsupported: strings.unsupportedTitle,
      error: strings.errorTitle,
    };
    $('title').textContent = TITLES[st] || '';

    var ver = $('version');
    if ((st === 'available' || st === 'downloaded') && view.version) {
      ver.textContent = 'v' + view.version;
      ver.style.display = 'inline-block';
    } else {
      ver.style.display = 'none';
    }

    // 正文：available 带版本号与体积；downloaded 说明重启安装；error 直接给错误原文
    var body = '';
    if (st === 'checking') body = strings.checkingBody;
    else if (st === 'latest') body = strings.latestBody.replace('{current}', view.current || '');
    else if (st === 'available') {
      body = (view.rebuild ? strings.rebuildBody : strings.availableBody)
        .replace('{version}', view.version || '')
        .replace('{current}', view.current || '')
        + (view.sizeMB ? ' ' + strings.sizeSuffix.replace('{mb}', String(view.sizeMB)) : '');
      if (view.commit) body += '\n' + strings.commitLabel.replace('{commit}', view.commit);
    }
    else if (st === 'downloading') body = strings.downloadingBody;
    else if (st === 'downloaded') body = strings.downloadedBody;
    else if (st === 'unsupported') body = strings.unsupportedBody;
    else if (st === 'error') body = view.error || '';
    var bodyEl = $('body');
    bodyEl.textContent = body;
    bodyEl.style.display = body ? 'block' : 'none';

    var prog = $('progress');
    if (st === 'downloading') {
      prog.style.display = 'flex';
      var fill = $('barFill');
      if (view.percent != null) {
        fill.classList.remove('indet');
        fill.style.width = Math.max(0, Math.min(100, view.percent)) + '%';
        $('progressText').textContent = (view.percent || 0) + '% · ' + (view.mb || '0.0') + ' MB';
      } else {
        fill.classList.add('indet');
        $('progressText').textContent = (view.mb || '0.0') + ' MB';
      }
      $('fileName').style.display = 'none';
    } else {
      prog.style.display = 'none';
    }

    var btns = $('buttons');
    btns.textContent = '';
    if (st === 'latest') {
      addBtn(strings.ok, 'close', { primary: true });
    } else if (st === 'available' && view.via === 'github') {
      // 只有 GitHub 兜底通道可以手动触发下载；electron-updater（via==='updater'）
      // 是 autoDownload 自动后台下载，出主按钮点了也没人处理（1.7.0 审计发现的死按钮）
      addBtn(strings.downloadInstall, 'primary', { primary: true, icon: 'i-download' });
      addBtn(strings.openReleases, 'open-releases', { icon: 'i-open-in-new' });
      addBtn(strings.later, 'close');
    } else if (st === 'available') {
      // updater 态：后台已在自动下载，只给「打开 Releases」作兜底，不给死按钮
      addBtn(strings.openReleases, 'open-releases', { icon: 'i-open-in-new' });
      addBtn(strings.later, 'close');
    } else if (st === 'downloading') {
      addBtn(strings.cancel, 'close');
    } else if (st === 'downloaded') {
      addBtn(strings.installNow, 'primary', { primary: true });
      addBtn(strings.later, 'close');
    } else if (st === 'unsupported' || st === 'error') {
      addBtn(strings.openReleases, 'open-releases', { primary: true, icon: 'i-open-in-new' });
      addBtn(strings.close, 'close');
    }
    fit();
  }

  $('closeBtn').addEventListener('click', function () { api.action('close'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') api.action('close'); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  api.onState(function (view) { render(view); fit(); });
  api.bootstrap().then(function (boot) {
    if (!boot) return;
    strings = boot.strings || {};
    document.title = strings.windowTitle || 'CreditDaddy';
    $('brand').textContent = strings.windowTitle || 'CreditDaddy';
    render(boot.view);
    fit();
  });
})();
</script>
</body>
</html>
