name: Build CreditDaddy desktop (Windows / macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取 CHANGELOG.md 中当前版本的内容
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="CreditDaddy ${GITHUB_REF_NAME}: Qoder / WorkBuddy / ZCode 多账号管理与每日积分自动签到."
          fi
          # 写入多行输出
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "CreditDaddy ${{ github.ref_name }}" \
              --notes "${{ steps.changelog.outputs.notes }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build-mac:
    runs-on: macos-latest
    needs: [create-release]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stage app bundle into desktop/server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/server
          cp -r bin src package.json README.md desktop/server/

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Package macOS artifacts (unsigned)
        run: npx electron-builder --mac --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files-mac
          cp desktop/dist/*.dmg desktop/dist/*.zip release-files-mac/
          ( cd release-files-mac && for f in *; do mv "$f" "mac-$f"; done )
          ( cd release-files-mac && shasum -a 256 * > SHA256SUMS-mac.txt )
          cat release-files-mac/SHA256SUMS-mac.txt

      - name: Upload macOS artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-files-mac/
          gh release upload "${{ github.ref_name }}" \
            release-files-mac/* \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    runs-on: windows-latest
    needs: [create-release]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stage app bundle into desktop/server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/server
          cp -r bin src package.json README.md desktop/server/
          ls desktop/server/

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Package Windows artifacts (unsigned)
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}
        working-directory: desktop
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp desktop/dist/CreditDaddy-Setup-*.exe release-files/
          cp desktop/dist/CreditDaddy-Portable-*.exe release-files/
          ( cd release-files && sha256sum *.exe > SHA256SUMS-desktop.txt )
          cat release-files/SHA256SUMS-desktop.txt

      - name: Upload desktop artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-files/
          N=$(ls release-files/*.exe release-files/SHA256SUMS-desktop.txt 2>/dev/null | wc -l)
          [ "$N" -ge 3 ] || { echo "ERROR: expected >=3 files, found $N"; exit 1; }
          gh release upload "${{ github.ref_name }}" \
            release-files/*.exe \
            release-files/SHA256SUMS-desktop.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
