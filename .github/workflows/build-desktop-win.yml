name: Build CreditDaddy desktop (Windows / macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取 CHANGELOG.md 中当前版本的内容
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="CreditDaddy ${GITHUB_REF_NAME}: Qoder / WorkBuddy / ZCode 多账号管理与每日积分自动签到."
          fi
          # 写入多行输出。对齐 v1.2.0 起的 release note 完整架构：
          #   `## vX.Y.Z` 标题 + 主题行（写在 CHANGELOG 段落开头，随提取带上）+
          #   CHANGELOG 正文 + 安装渠道表 + 校验和说明 + Full Changelog 对比链接
          git fetch --tags --force origin 2>/dev/null || true
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          {
            echo "notes<<EOF"
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "$NOTES"
            echo
            echo "完整开发明细见 CHANGELOG.md。"
            echo
            echo "## 📦 安装"
            echo
            echo "| 渠道 | 说明 |"
            echo "| --- | --- |"
            echo "| fnOS / NAS | \`CreditDaddy-FnOS-${VERSION}-x86.fpk\` / \`CreditDaddy-FnOS-${VERSION}-arm.fpk\`(新标签页)、\`CreditDaddy-FnOS-Window-${VERSION}-*.fpk\`(桌面多窗口),在飞牛应用中心安装 |"
            echo "| Windows | \`CreditDaddy-Win-Setup-${VERSION}.exe\`(推荐,支持应用内检查更新)/ \`CreditDaddy-Win-Portable-${VERSION}.exe\`(免安装) |"
            echo "| macOS | \`CreditDaddy-Mac-Setup-${VERSION}-arm64.dmg\`(Apple 芯片)/ \`CreditDaddy-Mac-Setup-${VERSION}-x64.dmg\`(Intel),未公证,首次右键打开 |"
            echo "| npm CLI | \`npm i -g creditdaddy@${VERSION}\` |"
            echo
            echo "校验和见 SHA256SUMS-desktop.txt / SHA256SUMS-fpk.txt / SHA256SUMS-mac.txt。"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "Full Changelog: https://github.com/$GITHUB_REPOSITORY/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "CreditDaddy ${{ github.ref_name }}" \
              --notes "$RELEASE_NOTES"

  build-mac:
    runs-on: macos-latest
    needs: [create-release]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stage app bundle into desktop/server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/server
          cp -r bin src package.json README.md CHANGELOG.md desktop/server/

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Package macOS artifacts (unsigned)
        run: npx electron-builder --mac --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files-mac
          cp desktop/dist/*.dmg release-files-mac/
          # zip 没有 artifactName 配置段（schema 不认 zip 顶层键），按产物名手工改为平台统一命名
          for f in desktop/dist/*.zip; do
            b=$(basename "$f" .zip)
            r=${b#CreditDaddy-}
            cp "$f" "release-files-mac/CreditDaddy-Mac-Portable-$r.zip"
          done
          # electron-updater 的元数据必须保持原文件名（随 artifactName 已是 CreditDaddy-Mac-*）
          cp desktop/dist/latest-mac.yml release-files-mac/
          ( cd release-files-mac && shasum -a 256 * > SHA256SUMS-mac.txt )
          cat release-files-mac/SHA256SUMS-mac.txt

      - name: Upload macOS artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-files-mac/
          gh release upload "${{ github.ref_name }}" \
            release-files-mac/* \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    runs-on: windows-latest
    needs: [create-release]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stage app bundle into desktop/server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/server
          cp -r bin src package.json README.md CHANGELOG.md desktop/server/
          ls desktop/server/

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Package Windows artifacts (unsigned)
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}
        working-directory: desktop
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp desktop/dist/CreditDaddy-Win-Setup-*.exe release-files/
          cp desktop/dist/CreditDaddy-Win-Portable-*.exe release-files/
          # electron-updater 按 latest.yml 发现新版本（NSIS 自更新；Portable 不参与）
          cp desktop/dist/latest.yml release-files/
          ( cd release-files && sha256sum *.exe > SHA256SUMS-desktop.txt )
          cat release-files/SHA256SUMS-desktop.txt

      - name: Upload desktop artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-files/
          N=$(ls release-files/*.exe release-files/*.yml release-files/SHA256SUMS-desktop.txt 2>/dev/null | wc -l)
          [ "$N" -ge 4 ] || { echo "ERROR: expected >=4 files (2 exe + latest.yml + checksums), found $N"; exit 1; }
          gh release upload "${{ github.ref_name }}" \
            release-files/*.exe \
            release-files/latest.yml \
            release-files/SHA256SUMS-desktop.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
