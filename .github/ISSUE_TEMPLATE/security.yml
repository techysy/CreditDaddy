name: 🔒 安全问题
description: 安全缺陷、加固建议、审计反馈（含凭据 / 认证 / 网络暴露面）
title: "[安全] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **请不要在公开 issue 里贴任何可用的 token、Cookie 或你自己的凭据文件内容。**
        > 需要提供证据时，用脱敏后的片段（保留结构、替换真实值）即可。
        >
        > 如果你认为这是一个**尚未公开、可被利用的漏洞**，请先不要开公开 issue —— 走
        > [GitHub Security Advisories](https://github.com/techysy/CreditDaddy/security/advisories/new)
        > 私下报告，修复后再公开讨论。

        本仓库已有的安全基线（报告前请先确认是否已覆盖）：
        - 守护进程默认仅监听 `127.0.0.1`，数据全留本机，无任何云端上报
        - 面板访问密码（`panelKey`）可开启；fnOS 部署自动启用
        - 各产品线本地网关（Qoder / ZCode / Trae / MiniMax / mirasim / 妙手）局域网访问默认关闭，开启后仍需 IP 白名单
        - 凭据文件回写（如 `~/.minimax/auth.json`）使用 `0600` 权限与临时文件原子替换
        - 已存密码的查看需要面板密码二次确认

  - type: dropdown
    id: category
    attributes:
      label: 问题类别
      options:
        - 认证 / 授权 / 面板密码
        - 凭据存储与文件权限
        - 网络暴露面（监听地址、局域网、反向代理）
        - 本地网关（转发、注入、白名单）
        - 依赖漏洞
        - 信息泄漏（日志、错误响应、进程参数）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 你认为的严重程度
      description: 按「利用难度 × 影响面」自评，维护者复核后可能调整。
      options:
        - 严重 —— 可远程未授权利用，或直接导致凭据泄漏
        - 中危 —— 需要一定前置条件（本地访问 / 特定配置）
        - 低危 —— 加固建议、纵深防御
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 受影响的版本
      description: 在哪个版本上确认存在。若跨多个版本，写范围。
      placeholder: 1.3.3 或 >= 1.2.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 什么机制有问题、影响是什么。**不要粘贴真实凭据。**
    validations:
      required: true

  - type: textarea
    id: poc
    attributes:
      label: 验证方式 / 复现步骤
      description: 如何确认它真的成立。命令请用脱敏值。
      render: shell
    validations:
      required: false

  - type: textarea
    id: suggestion
    attributes:
      label: 修复建议
      description: 有方案就写；没有也可以留空。
    validations:
      required: false

  - type: checkboxes
    id: prechecked
    attributes:
      label: 提交前确认
      options:
        - label: 我**没有**在本 issue 中粘贴任何真实可用的 token / Cookie / 密码
          required: true
        - label: 我已确认这不是需要私下报告的在野漏洞（若是，请走 Security Advisories）
          required: true
